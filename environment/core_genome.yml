name: efaecalis_core_genome
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Panaroo 1.8.0 currently requires an intbitset build unavailable for Python 3.12.
  - python=3.11.15
  - panaroo=1.8.0
  - snp-dists=1.2.0
  - mafft=7.526
  - iqtree=3.1.2
  - biopython=1.87
  - pandas=3.0.5
  - numpy=2.3.5
  # Reproducible R/ggtree stack used by scripts/07_core_genome/08_visualise_core_genome_tree.R
  - r-base=4.5.3
  - r-ape=5.8_1
  - r-ggplot2=4.0.3
  - r-dplyr=1.2.1
  - r-readr=2.2.0
  - r-stringr=1.6.0
  - r-tibble=3.3.1
  - bioconductor-ggtree=4.0.4
  - bioconductor-treeio=1.34.0
  - r-svglite=2.2.2
