name: efaecalis_core_genome
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Panaroo 1.8.0 currently requires an intbitset build unavailable for Python 3.12.
  - python=3.11.15
  - panaroo=1.8.0
  - snp-dists=1.2.0
  - mafft=7.526
  - iqtree=3.1.2
  - biopython=1.87
  - pandas=3.0.5
  - numpy=2.3.5
